<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegMosaic — Structured Regulatory Intelligence</title>
<meta name="description" content="Regulatory intelligence for engineering and compliance teams. In development.">
<meta property="og:title" content="RegMosaic">
<meta property="og:description" content="Regulatory intelligence for engineering and compliance teams. In development.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://regmosaic.ai">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="RegMosaic">
<meta name="twitter:description" content="Regulatory intelligence for engineering and compliance teams. In development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1620;
    --panel:#141F2A;
    --line:#28353F;
    --text:#E7EDF1;
    --muted:#8FA0AC;
    --teal:#3FB8A8;
    --serif:'Fraunces', serif;
    --sans:'IBM Plex Sans', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:520px;
    width:100%;
    text-align:center;
  }
  .wordmark{
    font-family:var(--serif);
    font-weight:600;
    font-size:38px;
    letter-spacing:-0.01em;
    margin-bottom:18px;
  }
  .tagline{
    color:var(--muted);
    font-size:16px;
    line-height:1.6;
    max-width:38ch;
    margin:0 auto 32px;
  }
  .badges{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:32px;
  }
  .badge{
    font-family:var(--mono);
    font-size:12px;
    color:var(--teal);
    border:1px solid #274842;
    background:var(--panel);
    padding:7px 12px;
    border-radius:2px;
  }
  .cta-row{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:36px;
  }
  .btn-primary{
    background:var(--teal); color:var(--ink); font-weight:600; font-size:15px;
    padding:12px 22px; border-radius:3px; text-decoration:none; border:1px solid var(--teal);
    transition:opacity .15s;
  }
  .btn-primary:hover{opacity:0.88;}
  .btn-ghost{
    color:var(--text); font-size:15px; padding:12px 20px; border:1px solid var(--line);
    border-radius:3px; text-decoration:none; transition:border-color .15s;
  }
  .btn-ghost:hover{border-color:var(--muted);}
  footer{
    font-size:13px; color:var(--muted);
    display:flex; justify-content:center; gap:16px; flex-wrap:wrap;
    border-top:1px solid var(--line); padding-top:20px;
  }
  footer a{color:var(--muted); text-decoration:none;}
  footer a:hover{color:var(--text);}
</style>
</head>
<body>

<div class="card">
  <div class="wordmark">RegMosaic</div>
  <p class="tagline">Regulatory intelligence for engineering and compliance teams. In development.</p>

  <div class="badges">
    <span class="badge">🔧 in development</span>
    <span class="badge">🔐 private repositories</span>
  </div>

  <div class="cta-row">
    <a class="btn-primary" href="mailto:hello@regmosaic.ai">hello@regmosaic.ai</a>
  </div>

  <footer>
    <a href="https://github.com/regmosaic" target="_blank" rel="noopener">GitHub</a>
    <span>© 2026 RegMosaic, Inc.</span>
  </footer>
</div>

</body>
</html>
